<div class="rule">
    <h4>
        一般信息
    </h4>
    <ul>
        <li>该功能让您管理VIP玩家。</li>
        <li>在“用户名”筛选器中输入系统ID或用户名以查看特定玩家。</li>
    </ul>
</div>
<div class="line">
</div>
<div class="rule">
    <h4>
        报告准则
    </h4>
    <ul>
        <li><b>用户名：</b> 会员注册的用户名。</li>
        <li>
            <b>系统ID：</b> 系统为每个账户产生的数字序列ID。
        </li>
        <li>
            <b>VIP：</b> 显示所选播放器的VIP状态，还允许更改所选播放器的状态。
        </li>
    </ul>
</div>
<div class="line">
</div>
<div class="rule">
    <h4>
        其他功能
    </h4>
    <ul>
        <li><b>激活VIP按钮：</b> 选择一个或多个玩家，然后单击此按钮以激活所选的玩家。</li>
        <li>
            <b>停用VIP按钮：</b> 选择一个或多个玩家，然后单击此按钮以停用所选的玩家。
        </li>
        <li>
            <b>上传VIP列表：</b> 单击此按钮可上传VIP播放器列表。
        </li>
    </ul>
</div>
